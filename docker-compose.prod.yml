# Docker Compose Production Configuration
# Production-ready environment with security hardening and performance tuning
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# ⚠️  Before deploying:
#   1. Set GEMINI_API_KEY in .env file
#   2. Change all default passwords
#   3. Generate secure JWT_SECRET

version: '3.8'

services:
  # ─── PostgreSQL Database ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_customer_support_chatbot}
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_customer_support_chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chatbot_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ─── Spring Boot Backend ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chatbot_backend_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # Bind to localhost only
    environment:
      # Database
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_customer_support_chatbot}

      # Security
      SECURITY_USER: ${SECURITY_USER:-admin}
      SECURITY_PASSWORD: ${SECURITY_PASSWORD:?Set SECURITY_PASSWORD in .env}

      # Gemini API
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}

      # Mail
      MAIL_HOST: ${MAIL_HOST:-smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      # Java tuning
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - chatbot_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ─── Vue 3 Frontend (Nginx) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatbot_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - chatbot_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

# ─── Networks ──────────────────────────────────────────────────────────
networks:
  chatbot_network:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────
volumes:
  pgdata_prod:
    driver: local

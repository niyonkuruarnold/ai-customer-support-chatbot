# ─── Staging Profile ──────────────────────────────────────────────
# Activate with: --spring.profiles.active=staging
#
# Overrides for the staging environment. The staging data seeder
# (StagingDataSeeder) runs automatically when this profile is active
# or when the users table is empty.

# Aggressive schema update for staging — allow Hibernate to add new
# columns/tables as the schema evolves.
spring.jpa.hibernate.ddl-auto=update

# Show SQL in staging for debugging
spring.jpa.show-sql=true

# Verbose logging for the seeder
logging.level.com.codafriqa.ai_customer_support_chatbot.config.StagingDataSeeder=DEBUG
logging.level.com.codafriqa.ai_customer_support_chatbot.config.ToolDataSeeder=DEBUG

# ─── Staging Profile ──────────────────────────────────────────────
# Activate with: --spring.profiles.active=staging
#
# Overrides for the staging environment. The staging data seeder
# (StagingDataSeeder) runs automatically when this profile is active
# or when the users table is empty.

spring:
  datasource:
    url: jdbc:postgresql://chatbot_db_staging:5432/ai_support_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# STOMP WebSocket endpoint rules
# (Endpoints /ws-chat and /ws are registered in WebSocketConfig.java
#  with allowed origins for localhost dev and staging)
spring.websocket.sockjs-client.allowed-origins:
  - "http://localhost:5173"
  - "http://localhost:3000"
  - "http://localhost:8080"

# Verbose logging for the seeder
logging:
  level:
    com.codafriqa.ai_customer_support_chatbot.config.StagingDataSeeder: DEBUG
    com.codafriqa.ai_customer_support_chatbot.config.ToolDataSeeder: DEBUG

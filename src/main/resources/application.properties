server.port=8080
server.servlet.context-path=/

# Spring Application Name
spring.application.name=ai-customer-support-chatbot

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ai_customer_support_chatbot
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.codafriqa=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Security Configuration
spring.security.user.name=${SECURITY_USER:admin}
spring.security.user.password=${SECURITY_PASSWORD:admin123}

# Spring AI Configuration
#
# pgvector / vector store: create the vector extension + vector_store table at
# startup (Spring AI M6 defaults initialize-schema to false) and store
# embeddings at 1536 dimensions (OpenAI text-embedding-3-small / ada-002).
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536

# The API key is read from the OPENAI_API_KEY environment variable or a local
# .env file (spring-dotenv loads it before the context boots) — never hardcode
# secrets in this file. Copy .env.example to .env and fill in your key.
#
# The ': ' default resolves to an empty string when the variable is missing.
# Note: with this form, Spring AI M6 fails fast at boot ("OpenAI API key must
# be set") when no key is present anywhere — the .env file (or an exported
# variable) is therefore expected for local development. If you prefer the app
# to start without a key and degrade gracefully instead, remove the ': ' so
# the placeholder stays unresolved and calls fail at runtime with fallbacks:
#   spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.api-key=${OPENAI_API_KEY:}

# Multipart uploads (knowledge base documents)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email notifications (ticket lifecycle) — Mailtrap-style SMTP.
# Set MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD in your terminal or a
# local .env file (see .env.example) to enable real sending; the defaults
# keep the app bootable without credentials, and send failures are logged
# as warnings instead of breaking ticket operations.
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@codafriqa.local}
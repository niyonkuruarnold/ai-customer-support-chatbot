server.port=8080
server.servlet.context-path=/

# Spring Application Name
spring.application.name=ai-customer-support-chatbot

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ai_customer_support_chatbot
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.codafriqa=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Security Configuration
spring.security.user.name=${SECURITY_USER:admin}
spring.security.user.password=${SECURITY_PASSWORD:admin123}

# Spring AI Configuration
# The API key is read from the OPENAI_API_KEY environment variable or a local
# .env file (spring-dotenv loads it before the context boots) — never hardcode
# secrets in this file. Copy .env.example to .env and fill in your key.
#
# The ': ' default resolves to an empty string when the variable is missing.
# Note: with this form, Spring AI M6 fails fast at boot ("OpenAI API key must
# be set") when no key is present anywhere — the .env file (or an exported
# variable) is therefore expected for local development. If you prefer the app
# to start without a key and degrade gracefully instead, remove the ': ' so
# the placeholder stays unresolved and calls fail at runtime with fallbacks:
#   spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.api-key=${OPENAI_API_KEY:}

# Multipart uploads (knowledge base documents)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.port=8080
server.servlet.context-path=/

# Spring Application Name
spring.application.name=ai-customer-support-chatbot

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/ai_customer_support_chatbot
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Run schema.sql after Hibernate. The checked-in schema is the single source of
# truth for vector_store so Spring AI does not inherit a stale table definition.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Logging Configuration
logging.level.root=INFO
logging.level.com.codafriqa=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring Security Configuration
spring.security.user.name=${SECURITY_USER:admin}
spring.security.user.password=${SECURITY_PASSWORD:admin123}

# Spring AI Configuration — Google Gemini (free tier)
#
# pgvector / vector store: create the vector extension + vector_store table at
# startup (Spring AI M6 defaults initialize-schema=false) and store
# embeddings at 768 dimensions (the default output of Google text-embedding-004).
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
# pgvector HNSW/IVFFLAT indexes support up to 2000 dimensions;
# exact search remains supported without an ANN index.
spring.ai.vectorstore.pgvector.index-type=NONE

# Google GenAI — Chat model connection (Gemini Developer API, free tier)
# IMPORTANT: Do NOT set project-id or location here — doing so switches
# Spring AI to Vertex AI mode, which requires OAuth credentials instead
# of a simple API key.  API key mode is activated by providing api-key
# Google GenAI — Chat model connection (Gemini Developer API)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=text-embedding-004

# Multipart uploads (knowledge base documents)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email notifications (ticket lifecycle) — Mailtrap-style SMTP.
# Set MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD in your terminal or a
# local .env file (see .env.example) to enable real sending; the defaults
# keep the app bootable without credentials, and send failures are logged
# as warnings instead of breaking ticket operations.
spring.mail.host=${MAIL_HOST:smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@codafriqa.local}